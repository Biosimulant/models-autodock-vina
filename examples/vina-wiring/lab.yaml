schema_version: "2.0"
title: "AutoDock Vina Single Complex Example"
description: "Single-model space wiring example for AutoDock Vina docking."
models:
  - alias: "vina"
    path: "../../labs/vina-autodock-vina-docking-predictor/model"
    parameters:
      runtime_mode: "managed"
      default_receptor_pdbqt_path: "data/1iep/1iep_receptor.pdbqt"
      default_ligand_pdbqt_path: "data/1iep/1iep_ligand.pdbqt"
      default_run_options:
        box_center: [15.19, 53.903, 16.917]
        box_size: [20.0, 20.0, 20.0]
        exhaustiveness: 32
        n_poses: 9
        energy_range: 3.0
        cpu: 0
        scoring: "vina"
wiring: []
runtime:
  duration: 0.01
  communication_step: 0.01
  initial_inputs: {}
